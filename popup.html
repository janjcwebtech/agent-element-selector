<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 280px; margin: 0; padding: 14px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 13px; margin: 0 0 4px; }
  p.hint { margin: 0 0 12px; opacity: .7; font-size: 12px; }
  label { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  label span { flex: 1; }
  select, input[type=number] { font: inherit; padding: 2px 4px; }
  input[type=number] { width: 68px; }
  hr { border: 0; border-top: 1px solid rgba(128,128,128,.3); margin: 12px 0; }
  kbd { font-family: ui-monospace, Menlo, monospace; border: 1px solid rgba(128,128,128,.5);
        border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
  <h1>Agent Element Selector</h1>
  <p class="hint">Hold <kbd id="keyName">⌥ Option</kbd>, hover, click to copy an inline reference.
    Add <kbd id="fullKeyName">⇧ Shift</kbd> for full context. <kbd>Esc</kbd> cancels.</p>

  <label><input type="checkbox" id="enabled"><span>Enabled</span></label>

  <hr>

  <label><span>Modifier key</span>
    <select id="modifier">
      <option value="Alt">⌥ Option / Alt</option>
      <option value="Control">⌃ Control</option>
      <option value="Meta">⌘ Command</option>
      <option value="Shift">⇧ Shift</option>
    </select>
  </label>

  <p class="hint">Full context:</p>
  <label><input type="checkbox" id="includeAncestors"><span>Include ancestor chain</span></label>
  <label><input type="checkbox" id="includeText"><span>Include text content</span></label>

  <label><span>Text limit (chars)</span><input type="number" id="textLimit" min="0" max="5000" step="50"></label>
  <label><span>Ancestor depth</span><input type="number" id="ancestorDepth" min="0" max="15" step="1"></label>

  <p class="hint" id="status" style="margin-top:10px"></p>
  <script src="popup.js"></script>
</body>
</html>
